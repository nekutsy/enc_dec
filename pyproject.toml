[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enc-dec"
version = "0.1.0"
description = "Text → latent vector autoencoder"
requires-python = ">=3.12"

[project.scripts]
enc-dec = "cli.main:main"

[tool.setuptools.packages.find]
include = ["cli*", "core*", "model*", "training*", "inference*", "experiment*", "orchestration*", "registry*", "encoding*"]
